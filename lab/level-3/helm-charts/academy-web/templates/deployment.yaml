apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "academy-web.fullname" . }}
  labels:
    {{- include "academy-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "academy-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "academy-web.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [nginx]
          args: [-c, /config/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: site
              mountPath: /site
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "academy-web.fullname" . }}
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: site
          configMap:
            name: {{ include "academy-web.fullname" . }}
            items:
              - key: index.html
                path: index.html
        - name: temporary
          emptyDir: {}
