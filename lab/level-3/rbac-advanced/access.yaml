apiVersion: v1
kind: ServiceAccount
metadata:
  name: observer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ops-pod-observer
  labels:
    lab.k8sops.dev/aggregate: observer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-ops-observer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        lab.k8sops.dev/aggregate: observer
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-ops-observer
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: lab-rbac-advanced
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-settings
data:
  channel: stable
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scratch-role-author
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scratch-role-author
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scratch-role-author
subjects:
  - kind: ServiceAccount
    name: observer
    namespace: lab-rbac-advanced
