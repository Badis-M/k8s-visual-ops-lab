apiVersion: apps/v1
kind: Deployment
metadata:
  name: strict-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: strict-web
  template:
    metadata:
      labels:
        app: strict-web
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: strict-web
      containers:
        - name: web
          image: nginx:1.28.0-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
