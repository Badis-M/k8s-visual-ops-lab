services:
  app:
    build: .
    environment:
      LAB_OTLP_ENDPOINT: http://collector:4318
    ports:
      - "127.0.0.1:8008:8000"
    depends_on:
      - collector
    mem_limit: 128m
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:8889:8889"
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 512m
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: lab-admin
      GF_SECURITY_ADMIN_PASSWORD: ${LAB_GRAFANA_PASSWORD:?Choose a local lab password first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/lab.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    mem_limit: 512m
volumes:
  prometheus-data:
  grafana-data:
