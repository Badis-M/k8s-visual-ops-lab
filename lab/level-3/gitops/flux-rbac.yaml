apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-applier
  namespace: lab-gitops-flux
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitops-applier
  namespace: lab-gitops-flux
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitops-applier
  namespace: lab-gitops-flux
subjects:
  - kind: ServiceAccount
    name: gitops-applier
    namespace: lab-gitops-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitops-applier
