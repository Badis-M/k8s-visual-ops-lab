apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: academy-lab
  namespace: argocd
spec:
  sourceRepos:
    - REPLACE_REPO_URL
  destinations:
    - server: https://kubernetes.default.svc
      namespace: lab-gitops-argo
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academy-lab
  namespace: argocd
spec:
  project: academy-lab
  source:
    repoURL: REPLACE_REPO_URL
    targetRevision: "REPLACE_COMMIT_SHA"
    path: lab/level-3/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-gitops-argo
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - FailOnSharedResource=true
