apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: lab-kustomize-dev
namePrefix: dev-
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
replicas:
  - name: web
    count: 1
configMapGenerator:
  - name: web-content
    behavior: merge
    files:
      - index.html
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 16Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 32Mi
