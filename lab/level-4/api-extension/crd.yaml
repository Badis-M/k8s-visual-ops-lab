apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.workshops.k8sops.dev
spec:
  group: workshops.k8sops.dev
  scope: Namespaced
  names:
    kind: Gadget
    plural: gadgets
    singular: gadget
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: [v1]
      clientConfig:
        service:
          namespace: lab-conversion
          name: webhook
          path: /convert
          port: 443
        caBundle: CA_BUNDLE_PLACEHOLDER
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size:
                  type: integer
                  minimum: 1
                  maximum: 10
            status:
              type: object
              properties:
                observedReplicas:
                  type: integer
    - name: v2
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [replicas]
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10
            status:
              type: object
              properties:
                observedReplicas:
                  type: integer
