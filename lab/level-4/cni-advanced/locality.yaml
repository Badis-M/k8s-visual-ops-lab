apiVersion: v1
kind: Pod
metadata:
  name: source
  labels:
    app: locality-source
spec:
  automountServiceAccountToken: false
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  containers:
    - name: tools
      image: busybox:1.37.0
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: destination
  labels:
    app: locality-destination
spec:
  automountServiceAccountToken: false
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: locality-source
  initContainers:
    - name: payload
      image: busybox:1.37.0
      command: ["sh", "-c", "dd if=/dev/zero of=/site/payload.bin bs=1024 count=128"]
      volumeMounts:
        - name: site
          mountPath: /site
  containers:
    - name: web
      image: busybox:1.37.0
      command: ["httpd", "-f", "-p", "8080", "-h", "/site"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        tcpSocket:
          port: http
      volumeMounts:
        - name: site
          mountPath: /site
  volumes:
    - name: site
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: destination
spec:
  internalTrafficPolicy: Cluster
  selector:
    app: locality-destination
  ports:
    - name: http
      port: 80
      targetPort: http
