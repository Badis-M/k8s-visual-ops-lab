apiVersion: v1
kind: ServiceAccount
metadata:
  name: greeting-controller
  namespace: lab-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greeting-controller
  namespace: lab-operator
rules:
  - apiGroups: [learning.k8svisual.dev]
    resources: [greetings]
    verbs: [get, list, watch]
  - apiGroups: [learning.k8svisual.dev]
    resources: [greetings/status]
    verbs: [get, update, patch]
  - apiGroups: [learning.k8svisual.dev]
    resources: [greetings/finalizers]
    verbs: [update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greeting-controller
  namespace: lab-operator
subjects:
  - kind: ServiceAccount
    name: greeting-controller
    namespace: lab-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: greeting-controller
