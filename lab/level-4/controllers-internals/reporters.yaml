apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporters
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reconcile-reporter
  template:
    metadata:
      labels:
        app: reconcile-reporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporter
          image: busybox:1.37.0
          command: [sleep, "86400"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
