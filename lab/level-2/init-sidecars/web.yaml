apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr info;
    events { worker_connections 128; }
    http {
      access_log /logs/access.log;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        location / { root /site; }
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-web
  labels:
    app: sidecar-web
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: seed-page
      image: busybox:1.37.0
      command:
        - sh
        - -ec
        - |
          printf 'Prepared by the init container\n' > /site/index.html.tmp
          mv /site/index.html.tmp /site/index.html
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      volumeMounts:
        - name: site
          mountPath: /site
    - name: access-log
      image: busybox:1.37.0
      restartPolicy: Always
      command:
        - sh
        - -ec
        - |
          touch /logs/access.log
          exec tail -n+1 -F /logs/access.log
      startupProbe:
        exec:
          command: [test, -f, /logs/access.log]
        periodSeconds: 1
        failureThreshold: 10
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: web
      image: nginx:1.28.0
      command: [nginx]
      args: [-c, /etc/nginx/nginx.conf, -g, "daemon off;"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 2
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits: { cpu: 200m, memory: 64Mi }
      volumeMounts:
        - name: site
          mountPath: /site
          readOnly: true
        - name: logs
          mountPath: /logs
        - name: temporary
          mountPath: /tmp
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
  volumes:
    - name: site
      emptyDir: {}
    - name: logs
      emptyDir: {}
    - name: temporary
      emptyDir: {}
    - name: config
      configMap:
        name: web-config
