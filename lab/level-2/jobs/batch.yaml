apiVersion: batch/v1
kind: Job
metadata:
  name: report-batch
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 2
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - 'echo "Processing partition ${JOB_COMPLETION_INDEX}"; sleep 5; echo "Partition complete"'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
