apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: named-config-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-settings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: named-config-reader
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: lab-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: named-config-reader
