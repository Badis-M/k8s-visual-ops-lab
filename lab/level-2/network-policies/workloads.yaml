apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-web
  template:
    metadata:
      labels:
        app: policy-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: policy-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: trusted
  labels:
    role: trusted-client
spec:
  automountServiceAccountToken: false
  containers:
    - name: tools
      image: busybox:1.37.0
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted
  labels:
    role: untrusted-client
spec:
  automountServiceAccountToken: false
  containers:
    - name: tools
      image: busybox:1.37.0
      command: ["sleep", "3600"]
