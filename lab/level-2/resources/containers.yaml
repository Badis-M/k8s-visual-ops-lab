apiVersion: v1
kind: Pod
metadata:
  name: bounded
spec:
  containers:
    - name: web
      image: nginx:1.28.0
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: too-large
spec:
  containers:
    - name: sleeper
      image: busybox:1.37.0
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "1000"
          memory: 1Ti
        limits:
          cpu: "1000"
          memory: 1Ti
